name: CircleBBS - Build Web

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DOCKER_USERNAME: 'xiaoluoer'
  DOCKER_PASSWORD: 'dckr_pat_RAtLW51TfET3UuhxNR79G4vMkHA'

jobs:
  build-web:
    name: Build & Push Web Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install

      - name: Build project
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: bun run build

      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Build and Push Web Docker Image
        run: |
          docker build -t xiaoluoer/circlebbs:web-ai-image -f Dockerfile .
          docker push xiaoluoer/circlebbs:web-ai-image
