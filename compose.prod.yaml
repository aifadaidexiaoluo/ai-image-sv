name: designai

x-app-image: &app-image
  image: ${APP_IMAGE:-ai-image-sv:latest}
  build:
    context: .
    dockerfile: Dockerfile

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgres://designai:designai@postgres:5432/designai
  REDIS_URL: redis://redis:6379

services:
  app:
    <<: *app-image
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *app-env
      HOST: 0.0.0.0
      PORT: 3000
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.openlist.rule=Host(`ai-image-shop.circlebbs.com`)"
      - "traefik.http.routers.openlist.tls=true"        # 保留 TLS，但不使用 certResolver
      - "traefik.http.routers.openlist.entrypoints=websecure"
      - "traefik.http.routers.openlist.tls.certresolver="  # 空值，禁用自动证书
      - "traefik.http.services.openlist.loadbalancer.server.port=3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  migrate:
    <<: *app-image
    restart: 'no'
    env_file:
      - .env
    environment:
      <<: *app-env
    command: ['bun', 'run', 'db:migrate']
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: designai
      POSTGRES_PASSWORD: designai
      POSTGRES_DB: designai
    volumes:
      - designai-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U designai -d designai']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - designai-redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  designai-postgres:
  designai-redis:
